name: Build APK
on:
  push:
    branches: [apk-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Malumotlarim-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK to apk-out branch
        run: |
          mkdir out && cp app/build/outputs/apk/release/*.apk out/Malumotlarim.apk
          cd out && git init -q -b apk-out
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" apk-out
